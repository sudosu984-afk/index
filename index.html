<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bangladesh Flag with Magic</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
            margin: 0;
        }

        /* Flag Container (Green Background) */
        .flag {
            width: 300px;
            height: 180px;
            background-color: #006a4e; /* Bangladesh Flag Green */
            position: relative;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Red Circle inside the flag */
        .circle {
            width: 108px;
            height: 108px;
            background-color: #f42a41; /* Bangladesh Flag Red */
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Official flag ratio anujayi circle-ti halka bam pashe thake */
            margin-right: 15px; 
        }

        /* MAGIC Text Styling */
        .magic-text {
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            font-weight: bold;
            font-size: 20px;
            letter-spacing: 2px;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>

    <div class="flag">
        <div class="circle">
            <span class="magic-text">MAGIC</span>
        </div>
    </div>

</body>
</html>
